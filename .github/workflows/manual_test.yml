name: manual_test

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Nivel del log"
        required: true
        default: "info"
        type: choice
        options: [info, debug, warning, error, fatal]

      environment:
        description: "Entorno"
        type: environment

      dry_run:
        description: "Ejecutar sin aplicar los cambios"
        required: false
        default: false
        type: boolean

      reason:
        description: "Motivo de la ejecución"
        required: false
        default: "Manual execution"
        type: string


jobs:
  date_run:
    runs-on: ubuntu-24.04
    steps:
      - name: Mostrar todos los inputs
        env:
          LOG_LEVEL: ${{inputs.log_level}}
          ENVIRONMENT: ${{inputs.environment}}
          DRY_RUN: ${{inputs.dry_run}}
          REASON: ${{inputs.reason}}
        run: |
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "DRY_RUN: $DRY_RUN"
          echo "REASON: $REASON"

      - name: Deploy si no es dry-run
        if: ${{inputs.dry_run == false}}
        env:
          ENVIRONMENT: ${{inputs.environment}}
        run: |
          echo "Deploying to $ENVIRONMENT"

    